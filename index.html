 document.addEventListener('keydown',k);stop=()=>document.removeEventListener('keydown',k);draw()}
function snake(el){const N=15;let s=[[7,7]],d=[1,0],f=[3,3],sc=0,run=false,iv;
 el.innerHTML=`<div class="card"><div class="top"><b>Змейка</b><span id="sc">0</span></div><canvas id="c" width="300" height="300"></canvas>
 <div class="dp"><span></span><button class="s" data-v="0,-1">⬆</button><span></span><button class="s" data-v="-1,0">⬅</button><button class="s" data-v="0,1">⬇</button><button class="s" data-v="1,0">➡</button></div>
 <button id="go" style="margin-top:8px;width:100%">Старт</button></div>`;
 const cx=$('#c').getContext('2d');let sx,sy;const cv=$('#c');cv.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)set(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1])};
 const set=v=>{if(v[0]!==-d[0]||v[1]!==-d[1])d=v};
 el.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>set(x.dataset.v.split(',').map(Number)));
 const k=e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();set(m)}};
 document.addEventListener('keydown',k);
 const draw=()=>{cx.clearRect(0,0,300,300);cx.fillStyle='#e5484d';cx.fillRect(f[0]*20,f[1]*20,18,18);cx.fillStyle='#1fb26b';s.forEach(p=>cx.fillRect(p[0]*20,p[1]*20,18,18))};
 function tick(){const h=[s[0][0]+d[0],s[0][1]+d[1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]==h[0]&&p[1]==h[1])){clearInterval(iv);run=false;snd('lose');rec('Змейка',sc);$('#go').textContent='Игра окончена: '+sc+'. Ещё раз';s=[[7,7]];d=[1,0];sc=0;return}
  s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;$('#sc').textContent=sc;f=[Math.random()*N|0,Math.random()*N|0]}else s.pop();draw()}
 $('#go').onclick=()=>{if(run)return;run=true;sc=0;$('#sc').textContent=0;iv=setInterval(tick,230)};
 stop=()=>{clearInterval(iv);document.removeEventListener('keydown',k)};draw()}
function clicker(el){let n=0,t=0,run=false,iv,TT=null;const ut=db.doc('meta/tour').onSnapshot(x=>{TT=x.exists?x.data():null;const e=$('#tn');if(e)e.textContent=TT&&TT.open?((TT.res||{})[me]!=null?'🏆 Турнир: твой результат '+TT.res[me]:'🏆 Идёт турнир! Приз '+TT.prize+'. Одна попытка'):''});
 el.innerHTML=`<div class="card" style="text-align:center"><h3>👆 Кликер: 10 секунд</h3><div id="cn" style="font-size:60px;font-weight:800">0</div><div class="m" id="tn" style="color:#ffd166"></div><div class="m" id="cx2">Нажми кнопку, чтобы начать</div><div class="m">Рекорд: <b>${(U.rec||{})['Кликер']||0}</b></div><button id="ck" style="font-size:56px;padding:34px 60px;margin-top:14px;touch-action:manipulation">👆</button></div>`;
 const cn=$('#cn'),ci=$('#cx2');
 $('#ck').onpointerdown=()=>{if(!run){n=0;run=true;t=10;iv=setInterval(()=>{t-=.1;if(t<=0){clearInterval(iv);run=false;ci.textContent='Время вышло: '+n+' кликов! Жми, чтобы заново';rec('Кликер',n);if(me!==ADM&&TT&&TT.open&&(TT.res||{})[me]==null)db.doc('meta/tour').update({['res.'+me]:n});fx();return}ci.textContent='Осталось '+t.toFixed(1)+' с'},100)}n++;cn.textContent=n};
 stop=()=>{clearInterval(iv);ut()}}
function ttt(el){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let u1,u2,msg='';
 stop=()=>{u1&&u1();u2&&u2()};
 function lobby(){stop();el.innerHTML=`<div class="card"><h3>❌⭕ Онлайн</h3><input id="bt" type="number" value="100" min="100" placeholder="Ставка"><button id="cr" style="width:100%">Создать комнату</button><p class="err">${msg}</p></div><div class="card"><h4>Открытые комнаты</h4><div id="ls" class="m">…</div></div>`;
  $('#cr').onclick=async()=>{const bet=+$('#bt').value|0;if(bet<100||bet>U.bal){msg='Ставка от 100 и не больше баланса';return lobby()}msg='';const c=String(Math.random()*9000+1000|0);
   await addBal(-bet);await db.doc('rooms/'+c).set({x:me,o:'',bet,board:'---------',turn:'x',win:'',px:false,po:false,ts:Date.now()});room(c)};
  u1=db.collection('rooms').onSnapshot(s=>{const L=s.docs.filter(d=>{const x=d.data();return !x.o&&x.x!==me&&!x.win&&Date.now()-x.ts<36e5});
   $('#ls').innerHTML=L.map(d=>{const x=d.data();return`<p>${x.x} · ставка ${x.bet} <button data-j="${d.id}">Играть</button></p>`}).join('')||'Нет, создай свою и позови друга';
   el.querySelectorAll('[data-j]').forEach(b=>b.onclick=async()=>{const r=(await db.doc('rooms/'+b.dataset.j).get()).data();if(!r||r.o||U.bal<r.bet){msg='Недоступно';return lobby()}
    await addBal(-r.bet);await db.doc('rooms/'+b.dataset.j).update({o:me});room(b.dataset.j)})})}
 function room(c){stop();let paid=false;u2=db.doc('rooms/'+c).onSnapshot(s=>{if(!s.exists)return lobby();const r=s.data(),mk=r.x==me?'x':'o';
  const myT=r.turn==mk&&r.o&&!r.win;
  el.innerHTML=`<div class="card"><div class="top"><b>Комната ${c}</b><span>Банк: ${r.bet*2} 💰</span></div><p>${r.x} ❌ vs ${r.o||'ждём соперника…'} ⭕</p>
  <div class="b3">${[...r.board].map((v,i)=>`<div data-c="${i}">${v=='-'?'':v=='x'?'❌':'⭕'}</div>`).join('')}</div>
  <p style="text-align:center"><b>${r.win?(r.win=='d'?'Ничья, ставки возвращены':(r.win==mk?'🏆 Ты выиграл '+r.bet*2:'Ты проиграл')):!r.o?'':myT?'Твой ход':'Ход соперника'}</b></p>
  <div class="row"><button class="s" id="lv">${!r.o?'Отменить':'Выйти'}</button></div></div>`;
  $('#lv').onclick=async()=>{if(!r.o&&!r.win){await addBal(r.bet);await db.doc('rooms/'+c).delete()}lobby()};
  el.querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>{const i=+d.dataset.c;if(!myT||r.board[i]!='-')return;
   const bd=[...r.board];bd[i]=mk;const w=W.some(l=>l.every(k=>bd[k]==mk))?mk:bd.includes('-')?'':'d';
   db.doc('rooms/'+c).update({board:bd.join(''),turn:mk=='x'?'o':'x',win:w})});
  if(r.win&&!paid&&!r['p'+mk]&&(r.win=='d'||r.win==mk)){paid=true;const n=r.win=='d'?r.bet:r.bet*2;addBal(n);if(r.win==mk){fx();mission('Крестики-нолики',1)}db.doc('rooms/'+c).update({['p'+mk]:true})}})}
 lobby()}
init();
</script></body></html>
