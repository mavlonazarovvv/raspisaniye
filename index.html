function pipsFor(r){const L=22,R=48,C=35,col=(x,ys)=>ys.map(y=>[x,y]);

if(r===2)return[...col(L,[28,50,72]),...col(R,[28,50,72]),[C,39],[C,61]];
if(r===3)return[...col(L,[26,42,58,74]),...col(R,[26,42,58,74]),[C,50]];
return[...col(L,[26,42,58,74]),...col(R,[26,42,58,74]),[C,34],[C,66]]}
function cardSVG(c){const r=rk(c),s=su(c),R=DR[r];let mid="";
if(r<=4)mid=pipsFor(r).map(([x,y])=>`<use href="#su${s}" x="${x-7}" y="${y-7}" width="14" height="14"${y>52?` transform="rotate(180 ${x} ${y})"`:""}/>`).join("");
else if(r===8)mid=`<use href="#su${s}" x="19" y="34" width="32" height="32"/>`;
else mid=`<rect x="15" y="20" width="40" height="60" rx="4" fill="#f6ecd2" stroke="currentColor" stroke-width="1"/><rect x="19" y="24" width="32" height="52" rx="2" fill="none" stroke="currentColor" stroke-width=".6" opacity=".5"/><text x="35" y="58" text-anchor="middle" font-size="28" font-weight="700" font-family="Georgia,serif">${R}</text><use href="#su${s}" x="27" y="25" width="16" height="16"/><use href="#su${s}" x="27" y="59" width="16" height="16" transform="rotate(180 35 67)"/>`;
const cn=`<text x="8" y="17" font-size="${R==="10"?11:13}" font-weight="700" text-anchor="middle" font-family="Georgia,serif">${R}</text><use href="#su${s}" x="3" y="19" width="10" height="10"/>`;
return`<svg viewBox="0 0 70 100" role="img" aria-label="${R} ${["пики","трефы","бубны","червы"][s]}"><rect x=".5" y=".5" width="69" height="99" rx="7" fill="#fff" stroke="#b9c0cc"/><g fill="currentColor">${cn}<g transform="rotate(180 35 50)">${cn}</g>${mid}</g></svg>`}
const BK='<svg viewBox="0 0 70 100" aria-hidden="true"><rect x=".5" y=".5" width="69" height="99" rx="7" fill="#fff" stroke="#b9c0cc"/><rect x="5" y="5" width="60" height="90" rx="4" fill="#2b2060"/><rect x="9" y="9" width="52" height="82" rx="2" fill="none" stroke="#ff6cc3" stroke-width="1"/><path d="M35 22l13 28-13 28-13-28z" fill="none" stroke="#ff6cc3" stroke-width="1.2"/><circle cx="35" cy="50" r="5" fill="#ff6cc3"/></svg>';

/* ---------- GPS readout + opt-in location sharing + admin live map ---------- */
let GPW=null,GPR=false,gpLast=0,gpPos=null,LM=null,LMK={},LFIT=true;
const shk=()=>"shl_"+(me?me.login:""),isSh=()=>{try{return !!me&&!me.admin&&localStorage.getItem(shk())==="1"}catch(e){return false}};
function gpsSync(){const on=GPR||isSh();if(on&&GPW==null&&navigator.geolocation)GPW=navigator.geolocation.watchPosition(gpsPos,gpsErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});else if(!on&&GPW!=null){navigator.geolocation.clearWatch(GPW);GPW=null}}
function gpsShow(c){const o=$("#gpo");if(!o||!GPR)return;const z=D.cfg.find(x=>x.id==="zone"),a=Math.round(c.accuracy||0);
o.innerHTML=(z?'<span style="color:#fff;font-size:1.5rem;font-weight:600">'+Math.round(hav(c.latitude,c.longitude,z.lat,z.lng))+' м</span> до университета<br>':"")+"Точность ±"+a+" м<br>"+c.latitude.toFixed(6)+", "+c.longitude.toFixed(6)+(a>10?"<br>Слабый сигнал, выйди на открытое место":"")}
function gpsPos(p){const c=p.coords;gpPos=c;gpsShow(c);
if(isSh()&&db&&Date.now()-gpLast>8000){gpLast=Date.now();db.doc("loc/"+me.login).set({login:me.login,name:me.name,lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy||0),ts:Date.now()}).catch(()=>{})}}
function gpsErr(er){const o=$("#gpo");if(o)o.textContent=er.code===1?"Нет доступа к геолокации. Разреши её в настройках браузера.":"Не удалось определить место";if(er.code===1){GPR=false;try{if(me)localStorage.removeItem(shk())}catch(e){}if(me&&db&&!me.admin)db.doc("loc/"+me.login).delete().catch(()=>{});gpsSync();setTimeout(gpsV,2500)}}
function gpsV(){const e=$("#gps");if(!e||!me)return;gpsSync();const sh=isSh();
e.innerHTML='<h3>Моё место</h3><div id="gpo" class="mu">'+(GPR?"Ищу спутники…":"Выключено")+'</div><div class="gpb"><button class="g s" id="gpb">'+(GPR?"Выключить":"Показать расстояние")+'</button>'+(me.admin?"":'<button class="g s" id="gsh">'+(sh?"Не делиться":"Делиться с админом")+'</button>')+'</div>'+(me.admin?"":'<p class="mu" style="margin:8px 0 0">'+(sh?"Админ видит ваше место на карте, пока эта страница открыта.":"Админ не видит ваше место.")+'</p>');
if(GPR&&gpPos)gpsShow(gpPos);
$("#gpb").onclick=()=>{if(!navigator.geolocation){$("#gpo").textContent="Геолокация не поддерживается";return}GPR=!GPR;gpsSync();gpsV()};
const g=$("#gsh");if(g)g.onclick=()=>{if(!sh){if(!navigator.geolocation){alert("Геолокация не поддерживается");return}if(!confirm("Админ будет видеть ваше точное место на карте, пока страница открыта. Включить? Выключить можно в любой момент."))return;try{localStorage.setItem(shk(),"1")}catch(x){}gpLast=0}else{try{localStorage.removeItem(shk())}catch(x){}if(db)db.doc("loc/"+me.login).delete().catch(()=>{})}gpsSync();gpsV()}}
function liveV(v){v.innerHTML='<div class="two"><div class="card"><div id="lmap" class="lmap"></div></div><div class="card late"><h3>Сейчас на карте</h3><div id="llist"></div></div></div>';
if(LM){try{LM.remove()}catch(e){}LM=null}LMK={};LFIT=true;const Lf=window.L,z=D.cfg.find(x=>x.id==="zone");
if(Lf&&Lf.map){try{LM=Lf.map("lmap").setView(z?[z.lat,z.lng]:[41.31,69.28],z?16:11);if(getComputedStyle(LM.getPane("mapPane")).position!=="absolute")throw 0;Lf.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(LM);if(z)Lf.circle([z.lat,z.lng],{radius:z.r,color:"#ff6cc3",weight:2,fill:false,dashArray:"6"}).addTo(LM)}catch(e){try{LM&&LM.remove()}catch(_){}LM=null}}
if(!LM)$("#lmap").innerHTML='<p class="mu" style="padding:12px">Карта не загрузилась. Список справа работает, у каждого есть ссылка на карту.</p>';
liveUpd();setTimeout(()=>LM&&LM.invalidateSize(),150)}
function liveUpd(){if(tab!=="live"||!me||!me.admin)return;const now=Date.now(),A=D.loc.filter(x=>now-x.ts<216e5&&typeof x.lat==="number").sort((a,b)=>b.ts-a.ts),Lf=window.L,z=D.cfg.find(x=>x.id==="zone"),fr=x=>now-x.ts<18e4;
const l=$("#llist");if(!l)return;
l.innerHTML=A.length?A.map(x=>`<div class="lp"><div><b>${esc(unm(x))}</b><div class="mu">${fr(x)?"в сети":"не в сети"} · ${ago(x.ts)} · ±${x.acc||0} м${z?" · до университета "+Math.round(hav(x.lat,x.lng,z.lat,z.lng))+" м":""}</div></div><div class="lpb"><button class="g s" data-lf="${esc(x.id)}">На карте</button> <a class="mu" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${x.lat},${x.lng}">↗</a></div></div>`).join(""):'<p class="mu">Пока никто не делится местоположением. Студенты включают это сами в блоке «Моё место».</p>';
l.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{const x=A.find(y=>y.id===b.dataset.lf);if(x&&LM)LM.setView([x.lat,x.lng],18)});
if(!LM||!Lf)return;const ids=new Set(A.map(x=>x.id));
Object.keys(LMK).forEach(k=>{if(!ids.has(k)){LM.removeLayer(LMK[k].m);LM.removeLayer(LMK[k].c);delete LMK[k]}});

else{o.c.setLatLng(p).setRadius(x.acc||10).setStyle({color:col});o.m.setLatLng(p).setStyle({fillColor:col});o.m.setTooltipContent(esc(unm(x)))}});

sub("users","users");sub("notes","nt");sub("loc","loc");sub("lessons","les");sub("hw","hw");sub("scores","sc");sub("config","cfg");sub("arrivals","arr");sub("rooms","rooms");["sea","ttt","dk","durak","quizzes","qlive","qstat"].forEach(x=>sub(x,x));
